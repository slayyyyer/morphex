name: morphex-ts

on:
  push:
    paths:
      - "morphex-ts/**"
      - "data/**"
      - "inflector-core/src/main/resources/**"
      - "test-fixtures/**"
      - "site/catalog.json"
      - ".github/workflows/morphex-ts.yml"
  pull_request:
    paths:
      - "morphex-ts/**"
      - "data/**"
      - "inflector-core/src/main/resources/**"
      - "test-fixtures/**"
      - "site/catalog.json"
      - ".github/workflows/morphex-ts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: TypeScript check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: morphex-ts

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: morphex-ts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate lexicons
        run: npm run build:data

      - name: Typecheck
        run: npm run typecheck

      - name: Lint and format check
        run: npm run lint

      - name: Conformance tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Validate package exports
        run: npm run check:package

  fixtures:
    name: Java fixture drift
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: morphex-ts/package-lock.json

      - name: Install dependencies
        working-directory: morphex-ts
        run: npm ci

      - name: Regenerate fixtures from the Java engine
        working-directory: morphex-ts
        run: npm run fixtures

      - name: Fail on drift
        run: git diff --exit-code -- test-fixtures site/catalog.json
