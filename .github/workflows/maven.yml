name: Maven

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        java: [17, 21]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Run Maven tests
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: Run coarse benchmark smoke gate
        run: |
          java -cp inflector-benchmarks/target/benchmarks.jar \
            io.github.slayyyyer.morphex.inflector.bench.BenchmarkSmoke

  python:
    name: Python research tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run candidate and compaction tests
        run: |
          python -m unittest tools.research.test_extract tools.research.test_lexicon tools.research.test_learning tools.research.test_splits tools.research.test_external_eval
