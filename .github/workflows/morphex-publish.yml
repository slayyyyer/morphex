# npm trusted publisher configuration:
#   workflow filename: morphex-publish.yml
#   allowed action: npm publish
#
# Release by pushing a tag that matches the package version, for example:
#   morphex-v1.4.0

name: morphex-publish

on:
  push:
    tags:
      - "morphex-v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: morphex-ts

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint and format check
        run: npm run lint

      - name: Conformance tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Validate package exports
        run: npm run check:package

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          expected="morphex-v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME does not match $expected" >&2
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --access public
